name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: Run quality gates
        run: make lint typecheck test build
